<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE BACKROOMS // Level 0</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, Helvetica, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #f7d94c; text-shadow: 0 2px 3px #000; }
    #title { position: absolute; top: 22px; left: 28px; font-size: 12px; letter-spacing: 4px; opacity: .72; }
    #status { position: absolute; bottom: 24px; left: 28px; font-size: 12px; letter-spacing: 1px; }
    #battery { position: absolute; right: 28px; bottom: 24px; font-size: 12px; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; transform: translate(-50%,-50%); border: 1px solid rgba(255,255,255,.75); }
    #start, #message { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(48,42,19,.55), rgba(0,0,0,.88)); z-index: 5; }
    #message { display: none; }
    .card { width: min(520px, calc(100% - 40px)); text-align: center; padding: 34px; border: 1px solid rgba(247,217,76,.35); background: rgba(20,18,10,.84); box-shadow: 0 0 60px #000; }
    h1 { margin: 0 0 8px; color: #f7d94c; font-size: 32px; letter-spacing: 8px; font-weight: 400; }
    p { color: #d8d0a7; line-height: 1.6; font-size: 13px; }
    button { cursor: pointer; border: 1px solid #f7d94c; background: transparent; color: #f7d94c; padding: 12px 24px; letter-spacing: 3px; margin-top: 12px; }
    button:hover { background: #f7d94c; color: #17150a; }
    #vignette { position: fixed; inset: 0; pointer-events:none; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 100%); z-index: 2; }
    #noise { position: fixed; inset: 0; pointer-events:none; z-index: 3; opacity:.06; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E"); }
  </style>
</head>
<body>
  <div id="start"><div class="card"><h1>BACKROOMS</h1><p>LEVEL 0 // THE HABITABLE ZONE</p><p>There is no exit marked on any map.<br>Find the humming doorway. Do not let it find you.</p><p>WASD to move · Mouse to look · SHIFT to sprint · F flashlight · ESC release mouse</p><button id="begin">ENTER LEVEL</button></div></div>
  <div id="message"><div class="card"><h1 id="messageTitle">SIGNAL LOST</h1><p id="messageText"></p><button id="restart">TRY AGAIN</button></div></div>
  <div id="hud"><div id="title">LEVEL 0 / 1998</div><div id="status">OBJECTIVE: LOCATE THE EXIT</div><div id="battery">FLASHLIGHT 100%</div><div id="crosshair"></div></div><div id="vignette"></div><div id="noise"></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8f843b);
    scene.fog = new THREE.Fog(0x8f843b, 5, 34);
    const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, .05, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const clock = new THREE.Clock();
    const keys = {}; let playing = false, dead = false, battery = 100, exitFound = false;
    const player = new THREE.Object3D(); player.position.set(0, 1.65, 0); scene.add(player); player.add(camera);
    const flashlight = new THREE.SpotLight(0xfff5bd, 4.2, 20, Math.PI / 7, .55, 1.5); flashlight.position.set(.12, -.08, -.1); camera.add(flashlight); camera.add(flashlight.target); flashlight.target.position.set(0, 0, -4);
    const fill = new THREE.HemisphereLight(0xffe87a, 0x332b16, 1.05); scene.add(fill);
    const colliders = [], exit = new THREE.Vector3(0, 1, 0);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xcbbd55, roughness: .92 });
    const carpetMat = new THREE.MeshStandardMaterial({ color: 0x705b29, roughness: 1 });
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xb9ae6b, roughness: 1 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x231d0c, roughness: 1 });

    function box(x,y,z,sx,sy,sz,mat,solid=true) { const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); if(solid) colliders.push({x, z, sx, sz}); return m; }
    function light(x,z, flicker=false) { const bulb = new THREE.Mesh(new THREE.BoxGeometry(1.7,.07,.45), new THREE.MeshBasicMaterial({color:0xfff0a0})); bulb.position.set(x,3.95,z); scene.add(bulb); const l = new THREE.PointLight(0xffe99a, 1.9, 8); l.position.set(x,3.7,z); l.userData.flicker=flicker; scene.add(l); return l; }

    // Carpet, ceiling and a deliberately confusing maze of corridors.
    box(0,-.08,0,54,.16,54,carpetMat,false); box(0,4.15,0,54,.18,54,ceilingMat,false);
    const walls = [
      [-11,2,-8,1,4,20], [11,2,7,1,4,18], [-3,2,-17,17,4,1], [4,2,17,14,4,1],
      [-17,2,4,1,4,17], [17,2,-8,1,4,18], [-6,2,7,10,4,1], [5,2,-2,1,4,11],
      [-1,2,13,10,4,1], [8,2,10,1,4,10], [-14,2,-15,7,4,1], [-15,2,14,1,4,8],
      [13,2,-15,7,4,1], [0,2,-8,8,4,1], [-8,2,0,1,4,10], [2,2,7,1,4,8],
      [-13,2,8,5,4,1], [14,2,8,5,4,1], [-4,2,-2,6,4,1], [5,2,-12,1,4,8]
    ]; walls.forEach(w => box(...w, wallMat));
    for(let x=-16;x<=16;x+=8) for(let z=-16;z<=16;z+=8) if(Math.random()>.18) light(x,z,true);
    exit.set(14,1,-12); const door = box(exit.x,2,exit.z,2.8,4,.2,darkMat,false); door.userData.exit=true;
    const sign = new THREE.Mesh(new THREE.BoxGeometry(1.7,.5,.08), new THREE.MeshBasicMaterial({color:0xff321f})); sign.position.set(exit.x,3.2,exit.z+.16); scene.add(sign);

    const enemy = new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.25,5,10), new THREE.MeshStandardMaterial({color:0x080706, roughness:1})); enemy.position.set(-14,1.15,12); enemy.visible=false; scene.add(enemy);
    let enemyTimer=0, enemyAwake=false;
    function blocked(x,z) { const r=.38; return colliders.some(c => Math.abs(x-c.x)<c.sx/2+r && Math.abs(z-c.z)<c.sz/2+r); }
    function showMessage(title,text) { dead=true; document.exitPointerLock?.(); document.getElementById('messageTitle').textContent=title; document.getElementById('messageText').textContent=text; document.getElementById('message').style.display='grid'; }
    function begin() { document.getElementById('start').style.display='none'; document.body.requestPointerLock(); playing=true; }
    document.getElementById('begin').onclick=begin; document.getElementById('restart').onclick=()=>location.reload();
    addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='KeyF' && battery>0) flashlight.visible=!flashlight.visible; }); addEventListener('keyup', e=>keys[e.code]=false);
    addEventListener('mousemove', e => { if(document.pointerLockElement===document.body && playing && !dead) { player.rotation.y -= e.movementX*.0022; camera.rotation.x = Math.max(-1.45,Math.min(1.45,camera.rotation.x-e.movementY*.0022)); } });
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

    function update(dt) {
      if(!playing || dead) return; const speed=(keys.ShiftLeft||keys.ShiftRight)?4.5:2.5; const input=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0)); if(input.lengthSq()) { input.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y); const nx=player.position.x+input.x*speed*dt,nz=player.position.z+input.z*speed*dt; if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz; }
      if(flashlight.visible) { battery=Math.max(0,battery-dt*.7); if(battery===0)flashlight.visible=false; } document.getElementById('battery').textContent='FLASHLIGHT '+Math.floor(battery)+'%';
      if(player.position.distanceTo(exit)<2.2) { showMessage('LEVEL CLEARED','You found a door. The room beyond is not Level 1.'); return; }
      enemyTimer+=dt; if(enemyTimer>18) { enemyAwake=true; enemy.visible=true; } if(enemyAwake) { const d=enemy.position.distanceTo(player.position); enemy.lookAt(player.position.x,enemy.position.y,player.position.z); if(d>1.4) enemy.position.add(enemy.position.clone().sub(player.position).normalize().multiplyScalar(-dt*.65)); else showMessage('NOCLIP FAILED','Something was waiting between the walls.'); }
      scene.traverse(o=>{if(o.isPointLight&&o.userData.flicker)o.intensity=1.4+Math.random()*.8;});
    }
    function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.05); update(dt); renderer.render(scene,camera); } animate();
  </script>
</body>
</html>
